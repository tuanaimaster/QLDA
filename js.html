  function uploadAvatarFromInput(input) {
    var file = input.files && input.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { showToast('Ảnh quá lớn (tối đa 5MB)', 'error'); return; }

    var reader = new FileReader();
    reader.onload = function(e) {
      var dataUrl = e.target.result;

      // Preview immediately
      var display = document.getElementById('profile-avatar-display');
      if (display) {
        display.innerHTML = '<img src="' + dataUrl + '" class="w-full h-full object-cover rounded-full" alt="preview" />' +
          '<div class="absolute inset-0 bg-black/30 rounded-full flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity" onclick="document.getElementById(\'avatar-file-input\').click()">' +
          '<i class="fas fa-camera text-white text-xl"></i>' +
          '</div>';
      }

      showToast('Đang tải ảnh lên...', 'info');
      var base64 = dataUrl.replace(/^data:[^;]+;base64,/, '');
      google.script.run
        .withSuccessHandler(function(resp) {
          if (resp && resp.success) {
            currentUser.avatar = resp.avatarUrl;
            currentUser._avatarDataUrl = dataUrl;
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            updateUIForUser(currentUser);
            showToast('Đã cập nhật avatar!', 'success');
          } else {
            showToast('Lỗi upload: ' + (resp ? resp.error : 'Không rõ'), 'error');
          }
        })
        .withFailureHandler(function(e) { showToast('Lỗi kết nối khi upload', 'error'); })
        .uploadAvatar(base64, file.type);
    };
    reader.readAsDataURL(file);
  }

  var AVATAR_GRADIENTS = [
    ['#667eea','#764ba2'],['#f093fb','#f5576c'],['#4facfe','#00f2fe'],
    ['#43e97b','#38f9d7'],['#fa709a','#fee140'],['#a18cd1','#fbc2eb'],

    var code = 0;
    for (var i = 0; i < (name||'').length; i++) code += name.charCodeAt(i);
    return AVATAR_GRADIENTS[code % AVATAR_GRADIENTS.length];
  }
  function _initials(name) {
    var parts = (name||'').trim().split(/\s+/);
    if (parts.length >= 2) return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
    return (name||'?').charAt(0).toUpperCase();
  }

  function getBadgeLevel(badge, stats) {
    var val = badge.getValue(stats);
    var cur = 0;
    for (var i = 0; i < badge.levels.length; i++) {
      if (val >= badge.levels[i].target) cur = badge.levels[i].lv;
    }
    return cur;
  }

  function getBadgeStorageKey(name) {
    return 'badge_levels_' + (name || '');
  }

  function getStoredBadgeLevels(name) {
    try {
      var parsed = JSON.parse(localStorage.getItem(getBadgeStorageKey(name)) || '{}');
      return (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) ? parsed : {};
    } catch (e) {
      return {};
    }
  }

  function getCurrentBadgeLevels(stats) {
    var levels = {};
    BADGE_DEFS.forEach(function(b) {
      levels[b.id] = getBadgeLevel(b, stats);
    });
    return levels;
  }

  function getDisplayBadgeLevel(badge, stats, storedLevels) {
    var current = getBadgeLevel(badge, stats);
    var stored = Number((storedLevels && storedLevels[badge.id]) || 0);
    return Math.max(current, stored);
  }

  function getBadgeProgressInfo(badge, stats, storedLevels) {
    var val = Number(badge.getValue(stats) || 0);
    var displayLv = getDisplayBadgeLevel(badge, stats, storedLevels);
    var tier = LEVEL_TIERS[displayLv] || LEVEL_TIERS[0];
    var currentCfg = badge.levels.find(function(l){ return l.lv === displayLv; }) || { target: 0, xp: 0 };
    var nextCfg = badge.levels.find(function(l){ return l.lv === displayLv + 1; }) || null;
    var prevTarget = displayLv > 0 ? currentCfg.target : 0;
    var maxCfg = badge.levels[badge.levels.length - 1] || { target: 0 };
    var progressValue = nextCfg ? nextCfg.target : maxCfg.target;
    var progressPct = 100;
    var remainingText = 'Đã đạt cấp tối đa';

    if (nextCfg) {
      var denom = Math.max(1, nextCfg.target - prevTarget);
      progressPct = Math.round(((val - prevTarget) / denom) * 100);
      if (progressPct < 0) progressPct = 0;
      if (progressPct > 100) progressPct = 100;
      var remaining = Math.max(0, nextCfg.target - val);
      remainingText = remaining > 0
        ? ('Còn ' + remaining + ' ' + badge.unit + ' → Lv tiếp theo')
        : 'Sẵn sàng lên Lv tiếp theo';
    }

    return {
      value: val,
      displayLv: displayLv,
      tier: tier,
      nextCfg: nextCfg,
      progressPct: progressPct,
      progressValue: progressValue,
      remainingText: remainingText,
      currentCfg: currentCfg,
      maxCfg: maxCfg,
    };
  }

  function getTopBadgeHighlights(stats, storedLevels, limit) {
    var ranked = BADGE_DEFS.map(function(b) {
      var info = getBadgeProgressInfo(b, stats, storedLevels);
      return {
        badge: b,
        info: info,
        score: info.displayLv * 1000 + info.progressPct * 10 + Math.min(info.value, 999),
      };
    }).sort(function(a, b) {
      return b.score - a.score;
    });
    return ranked.slice(0, limit || 3);
  }

  function checkNewAchievements() {
    if (!currentUser) return;
    var name = currentUser.name || '';
    var stats = computeUserGameStats(name);
    var storageKey = getBadgeStorageKey(name);
    var stored = getStoredBadgeLevels(name);
    var updated = false;
    var topNewLevelBadge = null;
    BADGE_DEFS.forEach(function(b) {
      var cur = getBadgeLevel(b, stats);
      var prev = stored[b.id] || 0;
      if (cur > prev) {
        stored[b.id] = cur;
        updated = true;
        if (!topNewLevelBadge || cur > topNewLevelBadge.newLevel) {
          topNewLevelBadge = { badge: b, newLevel: cur };
        }
      }
    });
    if (updated) {
      localStorage.setItem(storageKey, JSON.stringify(stored));
      if (topNewLevelBadge) showAchievementUnlock(topNewLevelBadge.badge, topNewLevelBadge.newLevel);
    }
  }

  // ── Badge mini-card for roadmap ───────────────────────────────────────────
  function _renderTierBadgeMini(badgeId, stats, storedLevels) {
    var badge = BADGE_DEFS.find(function(b){ return b.id === badgeId; });
    if (!badge) return '';
    var lv = getDisplayBadgeLevel(badge, stats, storedLevels);
    var maxLv = badge.levels.length;
    var pct = lv < maxLv ? Math.round((badge.getValue(stats) / badge.levels[Math.max(0,lv)].target) * 100) : 100;
    pct = Math.min(100, pct);
    var isLocked = lv === 0 && pct < 10;
    var isNear   = lv === 0 && pct >= 10 && pct < 100;
    var cls = 'gm-road-badge-mini' + (isLocked ? ' locked' : '') + (isNear ? ' near' : '');
    return '<div class="' + cls + '">' +
      '<span class="gm-road-badge-mini-icon">' + badge.icon + '</span>' +
      '<div class="gm-road-badge-mini-info">' +
        '<div class="gm-road-badge-mini-name">' + badge.name + (lv > 0 ? ' <b>Lv.' + lv + '</b>' : '') + '</div>' +
        '<div class="gm-road-badge-mini-bar"><div class="gm-road-badge-mini-fill" style="width:' + pct + '%"></div></div>' +
      '</div>' +
    '</div>';
  }

  // ── Gate unlock requirement checklist ─────────────────────────────────────
  function _renderUnlockReqs(gateLevel, stats, storedLevels) {
    var req = LEVEL_REQUIREMENTS[gateLevel];
    if (!req) return '';
    var items = req.badges.map(function(r) {
      var badge = BADGE_DEFS.find(function(b){ return b.id === r.id; });
      if (!badge) return '';
      var got = getDisplayBadgeLevel(badge, stats, storedLevels);
      var ok = got >= r.lv;
      return '<li class="gm-road-req-item' + (ok ? ' met' : '') + '">' +
        (ok ? '✅' : '🔒') + ' ' + badge.name + ' Lv.' + r.lv +
        (ok ? '' : ' <span class="gm-road-req-cur">(có Lv.' + got + ')</span>') +
      '</li>';
    }).join('');
    return '<div class="gm-road-unlock-req">' +
      '<div class="gm-road-req-title">' + (req.hard ? '🔒 Cần để lên Lv.' + gateLevel : '⚠️ Khuyến nghị Lv.' + gateLevel) + '</div>' +
      '<ul class="gm-road-req-list">' + items + '</ul>' +
    '</div>';
  }

  function _renderCareerRoadmap(currentXP, stats, storedLevels) {
    stats = stats || {};
    storedLevels = storedLevels || {};
    var tierKeys = Object.keys(CAREER_TIERS);
    var tiersHTML = tierKeys.map(function(key) {
      var tier = CAREER_TIERS[key];
      var levelsInTier = LEVELS.filter(function(l){ return l.tier === key; });
      var minXP = levelsInTier[0] ? levelsInTier[0].minXP : 0;
      var maxXP = levelsInTier[levelsInTier.length - 1] ? levelsInTier[levelsInTier.length - 1].minXP : 0;

      var levelsHTML = levelsInTier.map(function(l) {
        var nextLvObj = LEVELS.find(function(x){ return x.level === l.level + 1; });
        var reached = currentXP >= l.minXP;
        var isCurrent = reached && (!nextLvObj || currentXP < nextLvObj.minXP);
        var gateOnThis = LEVEL_REQUIREMENTS[l.level + 1]; // gate for NEXT level = l.level+1
        var gateIcon = '';
        if (gateOnThis) {
          var allMet = gateOnThis.badges.every(function(r) {
            var badge = BADGE_DEFS.find(function(b){ return b.id === r.id; });
            return badge && getDisplayBadgeLevel(badge, stats, storedLevels) >= r.lv;
          });
          gateIcon = gateOnThis.hard
            ? (allMet ? ' <span title="Đã mở khoá">🔓</span>' : ' <span title="Cần badge để lên cấp">🔒</span>')
            : (allMet ? '' : ' <span title="Nên đạt badge này">⚠️</span>');
        }
        return '<div class="gm-road-level' + (reached ? ' reached' : '') + (isCurrent ? ' current' : '') + '"' +
          ' style="' + (reached ? '--lc:' + tier.color + ';' : '') + '">' +
          '<div class="gm-road-dot">' + (isCurrent ? '📍' : (reached ? '✓' : l.icon)) + '</div>' +
          '<div class="gm-road-lv-text">' +
            '<div class="gm-road-lv-name"><b>Lv.' + l.level + '</b> ' + l.name + gateIcon + '</div>' +
            '<div class="gm-road-lv-xp">' + l.minXP.toLocaleString() + ' XP</div>' +
            '<div class="gm-road-lv-role">' + (l.role || '') + '</div>' +
          '</div>' +
        '</div>';
      }).join('');

      // Badge mini-cards for this tier
      var badgeIds = TIER_BADGE_MAP[key] || [];
      var badgesHTML = badgeIds.map(function(id) {
        return _renderTierBadgeMini(id, stats, storedLevels);
      }).join('');

      // Unlock req block: show req for first level of tier (if any gate for that level)
      var firstLv = levelsInTier[0];
      var unlockReqHTML = firstLv ? _renderUnlockReqs(firstLv.level, stats, storedLevels) : '';

      return '<div class="gm-road-tier" style="--tc:' + tier.color + ';--tbg:' + tier.bg + ';">' +
        '<div class="gm-road-tier-head">' +
          '<div class="gm-road-tier-name">' + tier.name + '</div>' +
          '<div class="gm-road-tier-xp-range">' + minXP.toLocaleString() + ' – ' + maxXP.toLocaleString() + ' XP</div>' +
        '</div>' +
        '<div class="gm-road-levels">' + levelsHTML + '</div>' +
        (badgesHTML ? '<div class="gm-road-tier-badges">' + badgesHTML + '</div>' : '') +
        unlockReqHTML +
      '</div>';
    }).join('');

    return '<section class="gm-panel gm-career-roadmap" style="margin-bottom:18px;grid-column:1/-1;">' +
      '<div class="gm-panel-head"><h3 class="gm-panel-title">🗺️ Lộ trình thăng tiến</h3></div>' +
      '<div class="gm-panel-body gm-road-body">' + tiersHTML + '</div>' +
    '</section>';
  }

  function _computeRankedForPeriod(period) {
    var now = new Date();
    var periodStart = null;
    if (period === 'week') {
      var d = new Date(now); d.setHours(0,0,0,0);
      d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); // Monday
      periodStart = d;
    } else if (period === 'month') {
      periodStart = new Date(now.getFullYear(), now.getMonth(), 1);
    }
    return allStaff.map(function(s) {
      var name = s[COL.S_NAME] || '';
      var relevantTasks = periodStart
        ? allTasks.filter(function(t) {
            if ((t[COL.T_ASSIGNEE] || '') !== name) return false;
            if (!(t[COL.T_STATUS] || '').toLowerCase().includes('hoàn thành')) return false;
            var rd = t[COL.T_REPORT_DATE];
            if (!rd) return false;
            return new Date(rd) >= periodStart;
          })
        : null;
      var xpVal;
      if (!periodStart) {
        xpVal = computeUserGameStats(name).xp;
      } else {
        xpVal = relevantTasks.reduce(function(sum, t){ return sum + calculateXP(t); }, 0);
      }
      return {
        name: name,
        role: s[COL.S_ROLE] || '',
        stats: { xp: xpVal, completedAll: relevantTasks ? relevantTasks.length : 0, streak: 0, todayCompletedCount: 0 },
        avatarUrl: '',
        sLevels: {},
      };
    }).sort(function(a, b){ return b.stats.xp - a.stats.xp; });
  }

  function _renderLBContent(ranked, period, myName) {
    var list = period === 'all' ? ranked : _computeRankedForPeriod(period);
    if (!list || list.length === 0) return '<div class="text-center text-gray-400 py-6">Không có dữ liệu</div>';
    return '<div class="gm-lb-podium" style="grid-column:1/-1;">' +
        list.slice(0, 3).map(function(r, idx){ return _renderPodiumCard(r, idx, myName); }).join('') +
      '</div>' +
      '<div class="gm-lb-list" style="grid-column:1/-1;">' +
        list.slice(3, 12).map(function(r, idx){ return _renderListRow(r, idx + 3, myName); }).join('') +
      '</div>';
  }

            <p style="color:#6b7280;font-size:13px;margin-bottom:20px">Hệ thống Quản lý Dự án QLDA</p>
            <div style="border-top:1px solid ${tier.color}30;border-bottom:1px solid ${tier.color}30;padding:16px 0;margin:0 0 20px">
              <div style="font-size:28px;font-weight:900;color:#1f2937">${name}</div>
              <div style="font-size:14px;color:#6b7280;margin-top:4px">đã đạt cấp bậc <strong style="color:${tier.color}">${lvlInfo.name}</strong> (Lv.${lvlInfo.level})</div>
            </div>
            <div style="display:flex;justify-content:center;gap:24px;margin-bottom:20px">
              <div style="text-align:center"><div style="font-size:22px;font-weight:800;color:${tier.color}">${myStats.xp}</div><div style="font-size:11px;color:#9ca3af">Tổng XP</div></div>
              <div style="text-align:center"><div style="font-size:22px;font-weight:800;color:${tier.color}">${myStats.completedAll}</div><div style="font-size:11px;color:#9ca3af">Nhiệm vụ</div></div>
              <div style="text-align:center"><div style="font-size:22px;font-weight:800;color:${tier.color}">${earnedBadges.length}</div><div style="font-size:11px;color:#9ca3af">Huy hiệu</div></div>
              <div style="text-align:center"><div style="font-size:22px;font-weight:800;color:${tier.color}">${myStats.streak}</div><div style="font-size:11px;color:#9ca3af">Streak</div></div>
            </div>
            <div style="font-size:12px;color:#9ca3af">Ngày cấp: ${today}</div>
          </div>
        </div>
      </div>`;
    document.getElementById('modals-container').insertAdjacentHTML('beforeend', certHTML);
  }

</script>
