<script>
  // === Global Variables ===
  let chartInstance = null;
  let projectProgressChart = null;
  let staffPerformanceChart = null;
  let allProjects = [];
  let allTasks = [];
  let allStaff = [];
  let allCommentCounts = {}; // { 'TênUser': { total: N, today: M } }
  let currentSection = 'overview';
  let currentUser = null; // Store current logged in user
  let isAuthenticated = false;
  let draggedItem = null;
  let draggedProjectId = null;
  let currentStatListData = [];

  // === Gantt Chart Variables ===
  let currentGanttDate = new Date();
  let expandedProjects = new Set(); // Lưu ID của các dự án đang xổ

  let openedFromProjectDetails = null;

  // === Constants matching backend ===
  const COL = {
    P_ID: 'Mã dự án',
    P_NAME: 'Tên dự án',
    P_DESC: 'Mô tả dự án',
    P_MANAGER: 'Quản lý dự án',
    P_PARTICIPANTS: 'Người tham gia',
    P_START: 'Ngày bắt đầu',
    P_END: 'Ngày kết thúc',
    P_STATUS: 'Trạng thái dự án',
    T_ID: 'Mã nhiệm vụ',
    T_PID: 'Mã dự án',
    T_NAME: 'Tên nhiệm vụ',
    T_DESC: 'Mô tả nhiệm vụ',
    T_ASSIGNEE: 'Người thực hiện',
    T_STATUS: 'Trạng thái',
    T_PRIORITY: 'Ưu tiên',
    T_START: 'Ngày bắt đầu',
    T_DUE: 'Hạn chót',
    T_COMPLETION: 'Tiến độ (%)',
    T_REPORT_DATE: 'Ngày hoàn thành',
    T_TARGET: 'Mục tiêu',
    T_RESULT_LINKS: 'Link kết quả',
    T_OUTPUT: 'Kết quả đầu ra',
    T_NOTES: 'Ghi chú',
    T_RECURRING: 'Lặp lại',
    T_RECURRING_INTERVAL: 'Chu kỳ lặp',
    T_CREATOR: 'Người tạo',
    T_DEPENDENT_COUNT: 'Số người phụ thuộc',
    S_ID: 'Mã NV',
    S_NAME: 'Họ tên',
    S_EMAIL: 'Email',
    S_POS: 'Chức vụ',
    S_ROLE: 'Phân quyền',
    S_PASSWORD: 'Mật khẩu',
    A_TIME: 'Thời gian',
    A_ACTION: 'Hành động',
    A_USER: 'Người thực hiện',
    A_DETAILS: 'Chi tiết',
    N_ID: 'Mã thông báo',
    N_TIME: 'Thời gian',
    N_USER: 'Người nhận',
    N_CONTENT: 'Nội dung', // ← THÊM N_USER
  };

  // ============================================================
  // GAMIFICATION ENGINE — XP · LEVEL · STREAK · QUESTS
  // ============================================================

  const LEVELS = [
    { level:  1, name: 'Thực tập',          icon: '🌱', tier: 'execution',    minXP: 0,     role: 'Làm quen hệ thống, nhận task'        },
    { level:  2, name: 'Nhân viên',         icon: '📚', tier: 'execution',    minXP: 150,   role: 'Thực hiện task theo yêu cầu'          },
    { level:  3, name: 'Chuyên viên',       icon: '💼', tier: 'execution',    minXP: 400,   role: 'Làm task độc lập, ổn định'            },
    { level:  4, name: 'Senior',            icon: '⚡', tier: 'execution',    minXP: 800,   role: 'Xử lý task phức tạp, làm đều'         },
    { level:  5, name: 'Team Leader',       icon: '🔥', tier: 'coordination', minXP: 1400,  role: 'Giao task, hỗ trợ team'               },
    { level:  6, name: 'Coordinator',       icon: '💎', tier: 'coordination', minXP: 2200,  role: 'Theo dõi tiến độ, điều phối'          },
    { level:  7, name: 'Project Leader',    icon: '🎯', tier: 'coordination', minXP: 3200,  role: 'Quản lý nhóm nhỏ'                     },
    { level:  8, name: 'Project Manager',   icon: '🏆', tier: 'management',   minXP: 4500,  role: 'Quản lý 1 dự án'                      },
    { level:  9, name: 'Senior PM',         icon: '🌟', tier: 'management',   minXP: 6000,  role: 'Quản lý dự án lớn'                    },
    { level: 10, name: 'Program Manager',   icon: '👑', tier: 'management',   minXP: 8000,  role: 'Quản lý nhiều dự án'                  },
    { level: 11, name: 'Portfolio Manager', icon: '🚀', tier: 'leadership',   minXP: 11000, role: 'Quản lý danh mục dự án'               },
    { level: 12, name: 'Director',          icon: '⭐', tier: 'leadership',   minXP: 15000, role: 'Quyết định chiến lược'                },
    { level: 13, name: 'Head',              icon: '🏅', tier: 'leadership',   minXP: 20000, role: 'Lãnh đạo hệ thống'                    },
  ];

  const CAREER_TIERS = {
    execution:    { name: '👨‍💻 Thực Thi',   color: '#3b82f6', bg: '#eff6ff', levels: [1,2,3,4]   },
    coordination: { name: '👥 Điều Phối',  color: '#8b5cf6', bg: '#f5f3ff', levels: [5,6,7]     },
    management:   { name: '📊 Quản Lý',    color: '#f59e0b', bg: '#fffbeb', levels: [8,9,10]    },
    leadership:   { name: '🧠 Chiến Lược', color: '#ef4444', bg: '#fef2f2', levels: [11,12,13]  },
  };

  // Badge → Tier mapping for roadmap display
  const TIER_BADGE_MAP = {
    execution:    ['hoan_thanh', 'lam_deu'],
    coordination: ['giao_viec',  'ho_tro'],
    management:   ['dung_han',   'quan_ly'],
    leadership:   ['anh_huong',  'xuat_sac'],
  };

  // Hybrid level-gate requirements (hard: Lv5 & Lv8, visual: Lv11)
  const LEVEL_REQUIREMENTS = {
    5:  { hard: true,  badges: [{id:'hoan_thanh',lv:3},{id:'lam_deu',lv:2},{id:'giao_viec',lv:1}] },
    8:  { hard: true,  badges: [{id:'giao_viec', lv:3},{id:'ho_tro', lv:2},{id:'dung_han', lv:2}] },
    11: { hard: false, badges: [{id:'quan_ly',   lv:2},{id:'ho_tro', lv:3},{id:'dung_han', lv:3}] },
  };

  // Badge boost multipliers (additive, capped)
  const BADGE_BOOSTS = [
    { id: 'hoan_thanh', minLv: 3, bonus: 0.10 },
    { id: 'lam_deu',    minLv: 3, bonus: 0.10 },
    { id: 'ho_tro',     minLv: 2, bonus: 0.05 },
  ];
  const MAX_BADGE_BOOST_MULT = 1.30;

  // Base XP by difficulty: easy=10, medium=20, hard=40, very hard=80
  const TASK_XP = {
    'Thấp': 10, 'Trung bình': 20, 'Cao': 40, 'Khẩn cấp': 80,
    'default': 20
  };
  const CREATE_TASK_XP = 10;
  const ASSIGN_COMPLETE_ASSIGNER_XP = 20;
  const ASSIGN_COMPLETE_COMPLETER_XP = 10;
  const COMMENT_XP = 5;
  const COMMENT_XP_CAP_PER_DAY = 10;   // max comments/day counted for XP
  const COMMENT_XP_LIFETIME_CAP = 200; // max total comment XP contribution (from all comments)

  // Timing multipliers
  const EARLY_BONUS_MULT   = 1.5;  // +50% if done early
  const ONTIME_BONUS_MULT  = 1.2;  // +20% if done on-time
  const LATE_PENALTY_MULT  = 0.7;  // -30% if late

  // Combo multipliers (tasks completed in one day)
  const COMBO_TABLE = [
    { tasks: 10, mult: 2.0 },
    { tasks: 5,  mult: 1.5 },
    { tasks: 3,  mult: 1.2 },
  ];

  const RUNTIME_XP_STATE = {};

  function normalizePriority(priority) {
    var p = (priority || '').toLowerCase().trim();
    if (!p) return 'default';
    if (p.includes('khẩn')) return 'Khẩn cấp';
    if (p.includes('cao') || p.includes('hard')) return 'Cao';
    if (p.includes('trung') || p.includes('medium')) return 'Trung bình';
    if (p.includes('thấp') || p.includes('easy')) return 'Thấp';
    if (p.includes('very hard')) return 'Khẩn cấp';
    return 'default';
  }

  function getTaskXP(task) {
    var priority = normalizePriority(task[COL.T_PRIORITY]);
    return TASK_XP[priority] || TASK_XP['default'];
  }

  function getTaskTimingMultiplier(due, done) {
    if (!due || !done) return 1;
    var diffDays = Math.floor((due.getTime() - done.getTime()) / 86400000);
    if (diffDays >= 1) return EARLY_BONUS_MULT;
    if (done <= due) return ONTIME_BONUS_MULT;
    return LATE_PENALTY_MULT;
  }

  // calculateXP: base XP × timing multiplier × impact multiplier (dependentCount)
  function calculateXP(task, doneDateOverride) {
    var base = getTaskXP(task);
    var due  = task[COL.T_DUE]         ? new Date(task[COL.T_DUE])         : null;
    var done = doneDateOverride ? new Date(doneDateOverride) : (task[COL.T_REPORT_DATE] ? new Date(task[COL.T_REPORT_DATE]) : null);
    base = Math.round(base * getTaskTimingMultiplier(due, done));
    var dep = Math.min(parseInt(task[COL.T_DEPENDENT_COUNT] || task.dependentCount || 0), 20); // anti-cheat cap
    var impactMult = Math.min(1 + dep * 0.1, 3.0);
    base = Math.round(base * impactMult);
    return Math.max(1, base);
  }

  function getComboMultiplier(taskCount) {
    for (var i = 0; i < COMBO_TABLE.length; i++) {
      if (taskCount >= COMBO_TABLE[i].tasks) return COMBO_TABLE[i].mult;
    }
    return 1.0;
  }

  function getLevelInfo(xp) {
    var lvl = LEVELS[0];
    var idx = 0;
    for (var i = LEVELS.length - 1; i >= 0; i--) {
      if (xp >= LEVELS[i].minXP) { lvl = LEVELS[i]; idx = i; break; }
    }
    var nextLevel = LEVELS[idx + 1] || null;
    var xpInLevel = xp - lvl.minXP;
    var xpNeeded  = nextLevel ? (nextLevel.minXP - lvl.minXP) : 1;
    var progress  = nextLevel ? Math.min(100, Math.round(xpInLevel / xpNeeded * 100)) : 100;
    var tier = CAREER_TIERS[lvl.tier] || CAREER_TIERS.execution;
    // Compute gate info for the NEXT level (if any gate requirement exists)
    var nextLevelNum = idx + 2; // next level is (idx+1), 1-indexed = idx+2
    var gateInfo = LEVEL_REQUIREMENTS[nextLevelNum] || null;
    return Object.assign({}, lvl, { nextLevel: nextLevel, xpInLevel: xpInLevel, xpNeeded: xpNeeded, progress: progress, tierInfo: tier, gateInfo: gateInfo });
  }

  function _dayKey(d) {
    if (!d) return '';
    var c = new Date(d);
    c.setHours(0, 0, 0, 0);
    return c.toISOString().slice(0, 10);
  }

  function computeUserGameStats(staffName) {
    var completedTasks = allTasks.filter(function(t) {
      return (t[COL.T_STATUS] || '').toLowerCase().includes('hoàn thành')
          && t[COL.T_ASSIGNEE] === staffName;
    });

    var xp = 0;
    var onTimeCount = 0;
    var earlyCount  = 0;
    var lateCount   = 0;
    var perDay = {};

    completedTasks.forEach(function(t) {
      var taskXP = calculateXP(t);
      xp += taskXP;

      var due  = t[COL.T_DUE]  ? new Date(t[COL.T_DUE]) : null;
      var done = t[COL.T_REPORT_DATE] ? new Date(t[COL.T_REPORT_DATE]) : null;

      if (due && done) {
        if (done <= due) onTimeCount++;
        var diffDays = Math.floor((due.getTime() - done.getTime()) / 86400000);
        if (diffDays >= 1) earlyCount++;
        if (done > due) lateCount++;
      }

      var day = _dayKey(done);
      if (day) {
        if (!perDay[day]) perDay[day] = { count: 0, baseXP: 0 };
        perDay[day].count += 1;
        perDay[day].baseXP += taskXP;
      }

      // +10 XP bố sung nếu task do người khác tạo và giao cho mình
      var creator = t[COL.T_CREATOR] || '';
      if (creator && creator !== staffName) xp += ASSIGN_COMPLETE_COMPLETER_XP;
    });

    var comboBonusXP = 0;
    var bestComboMult = 1;
    var bestComboCount = 0;
    var todayKey = _dayKey(new Date());
    var todayCompletedCount = 0;
    var todayComboMult = 1;

    Object.keys(perDay).forEach(function(day) {
      var dayInfo = perDay[day];
      var mult = getComboMultiplier(dayInfo.count);
      if (mult > 1) comboBonusXP += Math.round(dayInfo.baseXP * (mult - 1));
      if (mult > bestComboMult) {
        bestComboMult = mult;
        bestComboCount = dayInfo.count;
      }
      if (day === todayKey) {
        todayCompletedCount = dayInfo.count;
        todayComboMult = mult;
      }
    });

    xp += comboBonusXP;

    // +10 XP cho mỗi task do mình tạo (CREATE_TASK_XP)
    var createdTasks = allTasks.filter(function(t) { return (t[COL.T_CREATOR] || '') === staffName; });
    xp += createdTasks.length * CREATE_TASK_XP;

    // +20 XP cho mỗi task do mình giao cho người khác và họ đã hoàn thành
    var assignerBonusTasks = allTasks.filter(function(t) {
      return (t[COL.T_CREATOR] || '') === staffName
          && (t[COL.T_ASSIGNEE] || '') !== staffName
          && (t[COL.T_STATUS] || '').toLowerCase().includes('hoàn thành');
    });
    xp += assignerBonusTasks.length * ASSIGN_COMPLETE_ASSIGNER_XP;

    // Fallback for old tasks without T_CREATOR: count assigned tasks (capped at 20)
    if (createdTasks.length === 0) {
      var legacyTasks = allTasks.filter(function(t) { return !t[COL.T_CREATOR] && t[COL.T_ASSIGNEE] === staffName; });
      xp += Math.min(legacyTasks.length, 20) * CREATE_TASK_XP;
    }

    // Compute streak
    var today = new Date(); today.setHours(0,0,0,0);
    var completionDays = new Set();
    completedTasks.forEach(function(t) {
      var rd = t[COL.T_REPORT_DATE];
      if (rd) { var d = new Date(rd); d.setHours(0,0,0,0); completionDays.add(d.getTime()); }
    });
    var streak = 0;
    var check = new Date(today);
    if (!completionDays.has(check.getTime())) check.setDate(check.getDate() - 1);
    while (completionDays.has(check.getTime())) { streak++; check.setDate(check.getDate() - 1); }

    var todayStr = today.toISOString().slice(0, 10);
    var completedToday = completedTasks.filter(function(t) {
      return (t[COL.T_REPORT_DATE] || '').slice(0, 10) === todayStr;
    }).length;
    var addedToday = allTasks.filter(function(t) {
      return (t[COL.T_CREATOR] || t[COL.T_ASSIGNEE]) === staffName
          && (t[COL.T_START] || '').slice(0, 10) === todayStr;
    }).length;
    var inProgress = allTasks.filter(function(t) {
      return t[COL.T_ASSIGNEE] === staffName
          && (t[COL.T_STATUS] || '').toLowerCase().includes('đang thực hiện');
    }).length;

    var onTimeRate = completedTasks.length > 0 ? Math.round((onTimeCount / completedTasks.length) * 100) : 0;
    var managedProjectsList = allProjects.filter(function(p){ return p[COL.P_MANAGER] === staffName; });
    var managedProjects = managedProjectsList.length;
    var managedLargeProjects = managedProjectsList.filter(function(p) {
      var pid = p[COL.P_ID];
      var taskCount = allTasks.filter(function(t){ return t[COL.T_PID] === pid; }).length;
      return taskCount >= 20;
    }).length;

    // New stats for 8-badge system
    var assignedToOthersCount = allTasks.filter(function(t) {
      return (t[COL.T_CREATOR] || '') === staffName
          && (t[COL.T_ASSIGNEE] || '') !== staffName
          && (t[COL.T_ASSIGNEE] || '') !== '';
    }).length;
    var totalDependentCount = allTasks.filter(function(t) {
      return (t[COL.T_ASSIGNEE] || '') === staffName;
    }).reduce(function(sum, t) {
      return sum + Math.min(parseInt(t[COL.T_DEPENDENT_COUNT] || t.dependentCount || 0), 20);
    }, 0);

    // Comment XP (anti-cheat: daily cap + lifetime cap)
    var commentCounts = allCommentCounts[staffName] || {};
    var todayComments  = Math.min(commentCounts.today || 0, COMMENT_XP_CAP_PER_DAY);
    var totalComments  = Math.min(commentCounts.total || 0, Math.round(COMMENT_XP_LIFETIME_CAP / COMMENT_XP));
    var pastComments   = Math.max(0, totalComments - (commentCounts.today || 0));
    var commentXP = (todayComments + pastComments) * COMMENT_XP;
    xp += commentXP;

    // Badge boosts (require intermediate stats for lookup — no circular ref)
    var tempStats = {
      completedAll: completedTasks.length, streak: streak,
      assignerCount: assignerBonusTasks.length, onTimeRate: onTimeRate,
    };
    var boostMult = 1.0;
    BADGE_BOOSTS.forEach(function(b) {
      var badge = BADGE_DEFS.find(function(bd){ return bd.id === b.id; });
      if (badge && getBadgeLevel(badge, tempStats) >= b.minLv) boostMult += b.bonus;
    });
    xp = Math.round(xp * Math.min(boostMult, MAX_BADGE_BOOST_MULT));

    return {
      xp: xp,
      level: getLevelInfo(xp),
      streak: streak,
      completedToday: completedToday,
      addedToday: addedToday,
      inProgress: inProgress,
      completedAll: completedTasks.length,
      createdCount: createdTasks.length,
      assignerCount: assignerBonusTasks.length,
      assignedToOthersCount: assignedToOthersCount,
      totalDependentCount: totalDependentCount,
      onTimeCount: onTimeCount,
      onTimeRate: onTimeRate,
      earlyCount: earlyCount,
      lateCount: lateCount,
      managedProjects: managedProjects,
      managedLargeProjects: managedLargeProjects,
      comboBonusXP: comboBonusXP,
      bestComboMult: bestComboMult,
      bestComboCount: bestComboCount,
      todayComboMult: todayComboMult,
      todayCompletedCount: todayCompletedCount,
      commentCount: commentCounts.total || 0,
      badgeBoostMult: Math.min(boostMult, MAX_BADGE_BOOST_MULT),
    };
  }

  function showXPPopup(amount, options) {
    if (typeof options === 'boolean') options = { isBonus: options };
    options = options || {};
    var xp = Math.round(Number(amount) || 0);
    var comboMultiplier = Number(options.comboMultiplier || 1);
    var icon = options.icon || (options.isBonus ? '⚡' : '🎉');

    var el = document.createElement('div');
    el.className = 'xp-popup' + (options.isBonus ? ' bonus' : '') + (comboMultiplier > 1 ? ' combo' : '');
    var xpText = (xp >= 0 ? '+' : '') + xp;
    el.innerHTML =
      '<span class="xp-popup-main">' + icon + ' ' + xpText + ' XP</span>' +
      (comboMultiplier > 1 ? '<span class="xp-popup-combo">🔥 x' + comboMultiplier.toFixed(1).replace(/\.0$/, '') + '</span>' : '');
    document.body.appendChild(el);
    setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 2400);
  }

  function showLevelUpAnimation(levelInfo) {
    if (!levelInfo) return;
    var overlay = document.createElement('div');
    overlay.className = 'levelup-overlay';
    overlay.innerHTML =
      '<div class="levelup-card">' +
        '<div class="levelup-title">LEVEL UP</div>' +
        '<div class="levelup-icon">' + levelInfo.icon + '</div>' +
        '<div class="levelup-level">Lv.' + levelInfo.level + '</div>' +
        '<div class="levelup-name">' + levelInfo.name + '</div>' +
      '</div>';
    document.body.appendChild(overlay);
    setTimeout(function() {
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
    }, 2200);
  }

  function checkLevelUp(user, previousXP, currentXP) {
    var name = typeof user === 'string' ? user : (user && user.name) || '';
    if (!name) return false;
    var before = getLevelInfo(previousXP || 0);
    var after = getLevelInfo(currentXP || 0);
    if (after.level > before.level) {
      showLevelUpAnimation(after);
      return true;
    }
    return false;
  }

  function updateBadgeProgress(user) {
    var name = typeof user === 'string' ? user : (user && user.name) || (currentUser ? currentUser.name || '' : '');
    if (!name) return;
    if (currentUser && (currentUser.name || '') === name) checkNewAchievements();
    if (currentSection === 'achievements') renderAchievements();
  }

  function addXP(user, amount, options) {
    var name = typeof user === 'string' ? user : (user && user.name) || '';
    if (!name) return;
    var baseStats = computeUserGameStats(name);
    var previousXP = (RUNTIME_XP_STATE[name] && typeof RUNTIME_XP_STATE[name].xp === 'number')
      ? RUNTIME_XP_STATE[name].xp
      : baseStats.xp;
    var delta = Math.round(Number(amount) || 0);
    var currentXP = Math.max(0, previousXP + delta);
    RUNTIME_XP_STATE[name] = { xp: currentXP, updatedAt: Date.now() };

    showXPPopup(delta, options || {});
    checkLevelUp(name, previousXP, currentXP);

    if (currentUser && (currentUser.name || '') === name) {
      setTimeout(function() {
        updateUserGameUI();
        updateBadgeProgress(name);
      }, 350);
    }
  }

  function showConfetti(x, y) {
    var colors = ['#667eea','#764ba2','#f59e0b','#10b981','#ef4444','#3b82f6'];
    for (var i = 0; i < 12; i++) {
      var piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left  = (x + (Math.random() - 0.5) * 120) + 'px';
      piece.style.top   = (y + (Math.random() - 0.5) * 60)  + 'px';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDelay = (Math.random() * 0.3) + 's';
      document.body.appendChild(piece);
      setTimeout(function(p) { if (p.parentNode) p.parentNode.removeChild(p); }, 1800, piece);
    }
  }

  function updateUserGameUI() {
    if (!currentUser || !allTasks.length) return;
    var stats = computeUserGameStats(currentUser.name || '');
    var lvl = stats.level;
    var nextLvl = LEVELS.find(function(l) { return l.level === lvl.level + 1; });
    var pct = nextLvl
      ? Math.round(((stats.xp - lvl.minXP) / (nextLvl.minXP - lvl.minXP)) * 100)
      : 100;

    var badge = document.getElementById('user-level-badge');
    if (badge) {
      badge.textContent = 'Lv.' + lvl.level + ' ' + lvl.icon;
      badge.classList.remove('hidden');
    }
    var streakBadge = document.getElementById('user-streak-badge');
    if (streakBadge) {
      if (stats.streak >= 1) {
        streakBadge.textContent = '🔥' + stats.streak;
        streakBadge.classList.remove('hidden');
      } else {
        streakBadge.classList.add('hidden');
      }
    }

    var comboBadge = document.getElementById('user-combo-badge');
    if (comboBadge) {
      if (stats.todayComboMult > 1) {
        comboBadge.textContent = '🔥 x' + stats.todayComboMult.toFixed(1).replace(/\.0$/, '');
        comboBadge.classList.remove('hidden');
      } else {
        comboBadge.classList.add('hidden');
      }
    }

    var bar = document.getElementById('user-xp-bar');
    if (bar) bar.style.width = Math.min(pct, 100) + '%';

    var xpLabel = document.getElementById('user-xp-label');
    if (xpLabel) xpLabel.textContent = stats.xp + ' XP';

    var xpNext = document.getElementById('user-xp-next');
    if (xpNext) xpNext.textContent = nextLvl ? ('→' + nextLvl.minXP + ' XP') : 'MAX';

    if (currentSection === 'achievements') renderMyProfileHero();

  // Daily quests definition & renderer
  function _buildQuestItems() {
    var name = currentUser ? (currentUser.name || '') : '';
    var stats = computeUserGameStats(name);
    return [
      { icon: '✅', label: 'Hoàn thành 1 nhiệm vụ hôm nay', reward: '+20 XP', done: stats.completedToday >= 1 },
      { icon: '🔥', label: 'Đạt combo 3 nhiệm vụ trong ngày', reward: 'Combo x1.2', done: stats.todayComboMult >= 1.2 },
      { icon: '⏰', label: 'Giữ tỉ lệ đúng hạn từ 80%', reward: '+20% XP', done: stats.onTimeRate >= 80 },
    ];
  }

  function _renderQuestList(quests) {
    return quests.map(function(q) {
      return '<div class="quest-card' + (q.done ? ' done' : '') + '">' +
        '<div class="quest-icon">' + q.icon + '</div>' +
        '<div class="quest-content">' +
          '<div class="quest-title">' + q.label + '</div>' +
          '<div class="quest-reward ' + (q.done ? 'done' : '') + '">' + (q.done ? '✓ Hoàn thành · ' : '') + q.reward + '</div>' +
        '</div>' +
        (q.done ? '<div class="quest-check">✓</div>' : '') +
      '</div>';
    }).join('');
  }

  function renderDailyQuests() {
    var el = document.getElementById('daily-quests-list');
    if (!el) return;
    var dateEl = document.getElementById('quest-date');
    if (dateEl) dateEl.textContent = new Date().toLocaleDateString('vi-VN', { weekday: 'long', day: '2-digit', month: '2-digit' });
    el.innerHTML = _renderQuestList(_buildQuestItems());
  }

  function renderOverviewQuests() {
    var el = document.getElementById('overview-quests');
    if (!el) return;
    el.innerHTML = _renderQuestList(_buildQuestItems());

  function checkAuthenticationAndInitialize() {
    showLoading('Đang kiểm tra đăng nhập...');

    google.script.run
      .withSuccessHandler(function (response) {
        hideLoading();

        if (response.requireLogin) {
          // User not logged in, show login modal
          showLoginModal();
        } else if (response.success) {
          // User is logged in, initialize app
          handleSuccessfulLogin(response);
        } else {
          // Error occurred
          showToast(response.error || 'Lỗi khi kiểm tra đăng nhập', 'error');
          showLoginModal();
        }
      })
      .withFailureHandler(function (error) {
        hideLoading();
        showToast('Lỗi kết nối: ' + error.message, 'error');
        showLoginModal();
      })
      .getInitialDataWithAuth();
  }

  function showLoginModal() {
    const loginModal = document.getElementById('login-modal');
    if (loginModal) {
      loginModal.classList.remove('opacity-0', 'invisible');
      loginModal.querySelector('.bg-white\\/90').classList.remove('scale-95');
      loginModal.querySelector('.bg-white\\/90').classList.add('scale-100');

      // Focus on email input
      setTimeout(() => {
        document.getElementById('login-email')?.focus();
      }, 300);
    }
  }

  function hideLoginModal() {
    const loginModal = document.getElementById('login-modal');
    if (loginModal) {
      loginModal.querySelector('.bg-white\\/90').classList.remove('scale-100');
      loginModal.querySelector('.bg-white\\/90').classList.add('scale-95');

      setTimeout(() => {
        loginModal.classList.add('opacity-0', 'invisible');
      }, 200);
    }
  }

  function handleLogin(email, password) {
    if (!email || !password) {
      showLoginError('Vui lòng nhập đầy đủ email và mật khẩu');
      return;
    }

    setLoginLoading(true);

    // Start loading data in parallel while authenticating
    document.getElementById('login-loading').classList.remove('hidden');

    google.script.run
      .withSuccessHandler(function (response) {
        setLoginLoading(false);
        document.getElementById('login-loading').classList.add('hidden');

        if (response.success) {
          hideLoginModal();
          hideLoginError();

          // Get user data and initialize
          google.script.run
            .withSuccessHandler(function (dataResponse) {
              if (dataResponse.success) {
                handleSuccessfulLogin(dataResponse);
                showToast('Đăng nhập thành công!', 'success');
              } else {
                showToast(dataResponse.error || 'Lỗi khi tải dữ liệu', 'error');
              }
            })
            .withFailureHandler(function (error) {
              showToast('Lỗi khi tải dữ liệu: ' + error.message, 'error');
            })
            .getDataForUser();
        } else {
          showLoginError(response.error || 'Đăng nhập thất bại');
        }
      })
      .withFailureHandler(function (error) {
        setLoginLoading(false);
        document.getElementById('login-loading').classList.add('hidden');
        showLoginError('Lỗi kết nối: ' + error.message);
      })
      .authenticateUser(email, password);
  }

  function handleSuccessfulLogin(dataResponse) {
    currentUser = dataResponse.user;
    isAuthenticated = true;

    allProjects = dataResponse.projects || [];
    allTasks = dataResponse.tasks || [];
    allStaff = dataResponse.staff || [];
    allCommentCounts = dataResponse.commentCounts || {};

    // Restore avatar from localStorage if exists
    var storedUser = null;
    try { storedUser = JSON.parse(localStorage.getItem('currentUser') || 'null'); } catch(e) {}
    if (storedUser && storedUser.email === currentUser.email && storedUser._avatarDataUrl) {
      currentUser._avatarDataUrl = storedUser._avatarDataUrl;
    }

    updateUIForUser(currentUser);

    // Populate kanban project filter
    var kanbanFilter = document.getElementById('kanban-project-filter');
    if (kanbanFilter) {
      kanbanFilter.innerHTML = '<option value="">Tất cả dự án</option>' +
        allProjects.map(function(p) { return '<option value="' + p[COL.P_ID] + '">' + p[COL.P_NAME] + '</option>'; }).join('');
      kanbanFilter.onchange = function() { renderKanban(); };
    }

    // Render UI
    renderStats(dataResponse.summaryStats);
    renderProjects();
    renderTasks();
    renderStaff();
    renderChart(dataResponse.chartData);
    renderProjectProgressChart();
    renderTaskPriorityChart();
    renderTimelineProgressChart();
    renderProjectComparisonChart();
    renderStaffPerformanceChart();
    renderActivity(dataResponse.recentActivities);
    renderPriorityTasksMini();
    renderTaskStats();
    renderProjectStats();
    updateUserGameUI();
    renderOverviewQuests();

    setupGanttEventListeners();
    if (currentSection === 'gantt') {
      renderGanttChart();
    } else if (currentSection === 'kanban') {
      renderKanban();
    } else if (currentSection === 'achievements') {
      renderAchievements();
    }

    // Load chat async
    setTimeout(() => {
      if (currentSection === 'overview') {
        loadChatMessagesAsync();
      }
    }, 500);
  }

  function loadChatMessagesAsync() {
    const container = document.getElementById('chat-messages');
    if (!container) return;

    container.innerHTML =
      '<div class="text-center text-gray-500 text-sm py-4"><i class="fas fa-spinner fa-spin mr-2"></i>Đang tải tin nhắn...</div>';

  function updateUIForUser(user) {
    const isAdminUser = isAdmin();
    const isManagerUser = user.role && user.role.toLowerCase().includes('quản lý');
    const isTeamLeaderUser = user.role && user.role.toLowerCase().includes('trưởng nhóm');

    // Update user info in sidebar
    document.getElementById('user-info').classList.remove('hidden');
    document.getElementById('login-prompt').classList.add('hidden');

    const userAvatar = document.getElementById('user-avatar');
    const userName = document.getElementById('user-name');
    const userRole = document.getElementById('user-role');

    if (userAvatar && userName && userRole) {
      const initials = (user.name || 'U')
        .split(' ')
        .map((n) => n[0])
        .join('')
        .toUpperCase()
        .slice(0, 2);
      userName.textContent = user.name;
      userRole.textContent = user.role;

      // Avatar: prefer local cache, then server URL, then initials
      const avatarSrc = user._avatarDataUrl || user.avatar;
      if (avatarSrc) {
        userAvatar.innerHTML = '<img src="' + avatarSrc + '" class="w-full h-full object-cover rounded-full" alt="avatar" ' +
          'onerror="this.style.display=\'none\';this.parentElement.textContent=\'' + initials + '\'" />';
      } else {
        userAvatar.textContent = initials;
      }

      // Make avatar clickable to open profile edit
      userAvatar.style.cursor = 'pointer';
      userAvatar.title = 'Nhấp để chỉnh sửa hồ sơ';
      userAvatar.onclick = function() { showEditProfileModal(); };
    }

    // THAY ĐỔI: Kiểm tra xem nhân viên có phải là người phụ trách dự án nào không
    const isProjectManager = allProjects.some((project) => project[COL.P_MANAGER] === user.name);

    // Hide/show navigation items based on role
    const projectsNav = document.getElementById('projects-nav');
    const staffNav = document.getElementById('staff-nav');

    if (isAdminUser) {
      // Show all nav items for admin
      if (projectsNav) projectsNav.style.display = 'flex';
      if (staffNav) staffNav.style.display = 'flex';
      showAdminButtons();
    } else if (isManagerUser || isTeamLeaderUser) {
      // Show projects nav for managers and team leaders, hide staff nav
      if (projectsNav) projectsNav.style.display = 'flex';
      if (staffNav) staffNav.style.display = 'none';
      hideAdminButtons();
    } else {
      // THAY ĐỔI: Hiển thị tab Dự án cho nhân viên phụ trách dự án
      if (projectsNav) {
        projectsNav.style.display = isProjectManager ? 'flex' : 'none';
      }
      if (staffNav) staffNav.style.display = 'none';
      hideAdminButtons();
    }

    // Hiển thị button thêm thông báo cho admin
    const addNotificationBtn = document.getElementById('add-notification-btn');
    if (isAdminUser) {
      if (addNotificationBtn) addNotificationBtn.classList.remove('hidden');
    } else {
      if (addNotificationBtn) addNotificationBtn.classList.add('hidden');
    }

    // Update page title to show current user
    updatePageTitle();
  }

      'add-project-btn',
      'add-project-standalone',

      'add-task-standalone',
      'add-staff-btn',

  function hideActionButtons() {
    const actionButtons = document.querySelectorAll('.edit-btn, .delete-btn, .copy-btn');
    actionButtons.forEach((button) => {
      const type = button.dataset.type;
      const id = button.dataset.id;

      if (isAdmin()) {
        // Admin có quyền đối với tất cả
        return;
      }

      // Xử lý nút copy
      if (button.classList.contains('copy-btn')) {
        if (!canUserCopyResource(type, id)) {
          button.style.display = 'none';
        }
        return;
      }

      // Logic cũ cho edit và delete buttons...
      if (isManager()) {
        // Quản lý có thể thao tác với project và task, nhưng không với staff
        if (type === 'staff') {
          button.style.display = 'none';
        }
      } else if (type === 'project' || type === 'staff') {
        // Nhân viên thường không thể sửa/xóa dự án và nhân viên
        button.style.display = 'none';
      } else if (type === 'task') {
        // Kiểm tra nếu task thuộc dự án mà người dùng quản lý
        const task = allTasks.find((t) => t[COL.T_ID] === id);
        if (task) {
          const projectId = task[COL.T_PID];
          const project = allProjects.find((p) => p[COL.P_ID] === projectId);

          // Hiển thị nút nếu người dùng là người quản lý dự án hoặc người được giao
          if (project && project[COL.P_MANAGER] === currentUser.name) {
            return; // Hiển thị nút
          }

          // Ẩn nút nếu người dùng không phải người được giao
          if (task[COL.T_ASSIGNEE] !== currentUser.name) {
            button.style.display = 'none';
          }
        }
      }
    });
  }

    const modal = document.getElementById('change-password-modal');
    modal.classList.add('active');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const newPassword = form.newPassword.value.trim();
      const confirmPassword = form.confirmPassword.value.trim();

      const submitBtn = form.querySelector('button[type="submit"]');
      setButtonLoading(submitBtn, true);

      google.script.run
        .withSuccessHandler(function (response) {
          setButtonLoading(submitBtn, false);
          if (response.success) {
            showToast(response.message, 'success');
            closeModal('change-password-modal');
          } else {
            // Hiển thị lỗi trong modal thay vì toast

              modal.querySelector('#change-password-error') || document.createElement('div');

          showToast('Lỗi: ' + error.message, 'error');

        .changePassword(newPassword, confirmPassword);

    // Setup close handlers
    const closeButtons = modal.querySelectorAll('.close-modal');
    closeButtons.forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        closeModal('change-password-modal');

  function setupEventListeners() {
    // Navigation
    document.querySelectorAll('.nav-link').forEach((link) => {
      link.addEventListener('click', function (e) {
        e.preventDefault();
        const section = this.dataset.section;
        if (section !== 'activity' && isAuthenticated) {
          switchSection(section);
        }
      });
    });

    document.getElementById('send-chat-btn')?.addEventListener('click', sendChatMessage);
    document.getElementById('chat-input')?.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        sendChatMessage();
      }
    });

    document.addEventListener('click', handleQuickCompleteTask);
    document.addEventListener('click', handleBadgeCardClick);

    document
      .getElementById('change-password-btn')
      ?.addEventListener('click', showChangePasswordModal);

    // Mobile menu
    document.getElementById('mobile-menu-btn').addEventListener('click', toggleMobileMenu);
    document.getElementById('mobile-overlay').addEventListener('click', closeMobileMenu);

    // Authentication buttons
    document.getElementById('login-btn')?.addEventListener('click', showLoginModal);
    document.getElementById('logout-btn')?.addEventListener('click', handleLogout);

    // Login form
    document.getElementById('login-form')?.addEventListener('submit', function (e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value.trim();
      handleLogin(email, password);
    });

    // Quick add buttons - only work if user is authenticated and has permission
    document.getElementById('quick-add-project')?.addEventListener('click', () => {
      // Thay đổi điều kiện từ isAdmin() thành isAdmin() || isManager()
      if (isAuthenticated && (isAdmin() || isManager() || isTeamLeader())) openModal('project');
    });
    document.getElementById('quick-add-task')?.addEventListener('click', () => {
      if (isAuthenticated && isAdmin()) openModal('task');
    });
    document.getElementById('quick-add-staff')?.addEventListener('click', () => {
      if (isAuthenticated && isAdmin()) openModal('staff');
    });

    // Add buttons
    document.getElementById('add-project-btn')?.addEventListener('click', () => {
      // Thay đổi điều kiện từ isAdmin() thành isAdmin() || isManager()
      if (isAuthenticated && (isAdmin() || isManager() || isTeamLeader())) openModal('project');
    });
    document.getElementById('add-project-standalone')?.addEventListener('click', () => {
      // Thay đổi điều kiện từ isAdmin() thành isAdmin() || isManager()
      if (isAuthenticated && (isAdmin() || isManager() || isTeamLeader())) openModal('project');
    });
    document.getElementById('add-task-btn')?.addEventListener('click', () => {
      if (isAuthenticated && canUserCreateTask()) openModal('task');
    });
    document.getElementById('add-task-standalone')?.addEventListener('click', () => {

  function filterTasks() {
    const searchTerm = document.getElementById('tasks-search').value.toLowerCase();
    const statusFilter = document.getElementById('tasks-status-filter').value;

    // CHỈ chọn các project containers, không chọn stats cards
    const projectContainers = document.querySelectorAll('#tasks-section .glass-card:has(table)');
    projectContainers.forEach((container) => {
      const rows = container.querySelectorAll('tbody tr');
      let hasVisibleTasks = false;

      rows.forEach((row) => {
        const text = row.textContent.toLowerCase();
        const statusBadge = row.querySelector('.status-badge');
        const status = statusBadge ? statusBadge.textContent.trim() : '';

        const matchesSearch = text.includes(searchTerm);
        const matchesStatus = !statusFilter || status === statusFilter;
        const isVisible = matchesSearch && matchesStatus;

        row.style.display = isVisible ? '' : 'none';
        if (isVisible) hasVisibleTasks = true;
      });

      container.style.display = hasVisibleTasks ? '' : 'none';
    });
  }

  function filterProjects() {
    const searchTerm = document.getElementById('projects-search').value.toLowerCase();
    const statusFilter = document.getElementById('projects-status-filter').value;

    const cards = document.querySelectorAll('.project-card');
    cards.forEach((card) => {
      const text = card.textContent.toLowerCase();
      const statusBadge = card.querySelector('.status-badge');
      const status = statusBadge ? statusBadge.textContent.trim() : '';

      const matchesSearch = text.includes(searchTerm);
      const matchesStatus = !statusFilter || status === statusFilter;
      const isVisible = matchesSearch && matchesStatus;

      card.style.display = isVisible ? 'block' : 'none';
    });
  }

  function filterTaskRows(searchTerm) {
    // Chọn các containers có table (project containers), không chọn stats cards
    const allContainers = document.querySelectorAll('#tasks-section .glass-card');
    const projectContainers = Array.from(allContainers).filter(
      (container) => container.querySelector('table') !== null
    );

    projectContainers.forEach((container) => {
      const rows = container.querySelectorAll('tbody tr');
      let hasVisibleTasks = false;

      rows.forEach((row) => {
        const text = row.textContent.toLowerCase();
        const isVisible = text.includes(searchTerm);
        row.style.display = isVisible ? '' : 'none';
        if (isVisible) hasVisibleTasks = true;
      });

      // Ẩn/hiện cả project container dựa trên việc có task nào visible không
      container.style.display = hasVisibleTasks ? '' : 'none';
    });
  }

  function canUserEditResource(type, id) {
    if (isAdmin()) return true;

    if (isManager() || isTeamLeader()) {
      // Managers and team leaders can edit projects and any tasks
      if (type === 'project') {
        return true;
      }

      if (type === 'task') {
        // Quản lý / Trưởng nhóm có thể sửa tất cả các task
        return true;
      }
    }

    // THÊM: Người dùng thường có thể sửa dự án họ phụ trách
    if (type === 'project') {
      const project = allProjects.find((p) => p[COL.P_ID] === id);
      if (project && project[COL.P_MANAGER] === currentUser.name) {
        return true;
      }
      return false;
    }

    // Người dùng thường có thể sửa task trong dự án mà họ quản lý
    if (type === 'task') {
      const task = allTasks.find((t) => t[COL.T_ID] === id);
      if (!task) return false;

      // Kiểm tra nếu task thuộc về dự án mà người dùng là quản lý
      const projectId = task[COL.T_PID];
      const project = allProjects.find((p) => p[COL.P_ID] === projectId);

      if (project && project[COL.P_MANAGER] === currentUser.name) {
        return true;
      }

      // Hoặc task được giao cho người dùng này
      return task[COL.T_ASSIGNEE] === currentUser.name;
    }

    return false;
  }

  function canUserDeleteResource(type, id) {
    if (isAdmin()) return true;

    if (isManager() || isTeamLeader()) {
      // Managers and team leaders can delete projects and any tasks
      if (type === 'project') {
        return true;
      }

      if (type === 'task') {
        // Quản lý / Trưởng nhóm có thể xóa tất cả các task
        return true;
      }
    }

    // THÊM: Người dùng thường có thể xóa dự án họ phụ trách
    if (type === 'project') {
      const project = allProjects.find((p) => p[COL.P_ID] === id);
      if (project && project[COL.P_MANAGER] === currentUser.name) {
        return true;
      }
      return false;
    }

    // Người dùng thường có thể xóa task trong dự án mà họ quản lý
    if (type === 'task') {
      const task = allTasks.find((t) => t[COL.T_ID] === id);
      if (!task) return false;

      // Kiểm tra nếu task thuộc về dự án mà người dùng là quản lý
      const projectId = task[COL.T_PID];
      const project = allProjects.find((p) => p[COL.P_ID] === projectId);

      if (project && project[COL.P_MANAGER] === currentUser.name) {
        return true;
      }

      // Hoặc task được giao cho người dùng này
      return task[COL.T_ASSIGNEE] === currentUser.name;
    }

    return false;
  }

    if (navEl) navEl.classList.add('active');

    // Update page title
    const titles = {
      overview: 'Tổng Quan',
      projects: 'Quản lý Dự án',
      tasks: 'Quản lý Nhiệm vụ',
      staff: 'Quản lý Nhân viên',

      kanban: 'Kanban Board',
      achievements: 'Thành tích & Bảng xếp hạng',
      connect: 'Kết nối',
    };
    document.getElementById('page-title').textContent = titles[sectionName] || 'Dashboard';

    // Show/hide sections
    document.querySelectorAll('.section').forEach((section) => {
      section.classList.remove('active');
    });
    var sectionEl = document.getElementById(sectionName + '-section');
    if (sectionEl) sectionEl.classList.add('active');

    if (sectionName === 'gantt') {
      // Auto-reset to current month so data is always visible
      currentGanttDate = new Date();

    } else if (sectionName === 'kanban') {
      setTimeout(() => { renderKanban(); }, 10);
    } else if (sectionName === 'achievements') {
      setTimeout(() => { renderAchievements(); }, 10);
    }

    // Close mobile menu if open
    closeMobileMenu();
  }

  // === Data Rendering ===
  function renderStats(stats) {
    // 1. TÍNH TOÁN LẠI TỪ DỮ LIỆU THỰC TẾ (allProjects, allTasks)
    const totalProjects = allProjects.length;
    const completedProjects = allProjects.filter((p) =>
      (p[COL.P_STATUS] || '').toLowerCase().includes('hoàn thành')
    ).length;

    // Tính Tỷ lệ dự án (Trung bình cộng tiến độ các dự án)
    const sumAllProjectProgress = allProjects.reduce((acc, proj) => {
      const pTasks = allTasks.filter((t) => t[COL.T_PID] === proj[COL.P_ID]);
      const pProgress =
        pTasks.length > 0
          ? pTasks.reduce((s, t) => s + parseInt(t[COL.T_COMPLETION] || 0), 0) / pTasks.length
          : 0;
      return acc + pProgress;
    }, 0);
    const projectCompletionRate =
      totalProjects > 0 ? Math.round(sumAllProjectProgress / totalProjects) : 0;

    const totalTasks = allTasks.length;
    const completedTasks = allTasks.filter((t) =>
      (t[COL.T_STATUS] || '').toLowerCase().includes('hoàn thành')
    ).length;
    const taskCompletionRate = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;

    const pendingTasks = allTasks.filter((t) =>
      (t[COL.T_STATUS] || '').toLowerCase().includes('chưa')
    ).length;
    const ongoingTasks = allTasks.filter((t) =>
      (t[COL.T_STATUS] || '').toLowerCase().includes('đang')
    ).length;
    const pausedTasks = allTasks.filter((t) =>
      (t[COL.T_STATUS] || '').toLowerCase().includes('tạm dừng')
    ).length;
    const activeTasks = ongoingTasks + pendingTasks + pausedTasks;

    const overdueTasks = allTasks.filter(
      (task) =>
        isTaskOverdue(task[COL.T_DUE]) &&
        !(task[COL.T_STATUS] || '').toLowerCase().includes('hoàn thành')
    ).length;
    const overdueRate = totalTasks > 0 ? Math.round((overdueTasks / totalTasks) * 100) : 0;

    // 2. CẬP NHẬT UI

    document.getElementById('completed-projects').textContent = completedProjects;

    document.getElementById('overdue-tasks').textContent = overdueTasks;

  function renderChart(chartData) {

    chartInstance = new Chart(ctx, {
      type: 'doughnut',
      data: {

        datasets: [
          {
            data: chartData.data,
            backgroundColor: colors.slice(0, chartData.labels.length),
            borderColor: colors.slice(0, chartData.labels.length).map((c) => c.replace('0.8', '1')),
            borderWidth: 2,
            hoverOffset: 8,

      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '65%',
        plugins: {
          legend: {
            position: 'bottom',
            labels: {
              padding: 15, // GIẢM từ 20 xuống 15
              usePointStyle: true,
              font: {
                size: 10, // GIẢM từ 12 xuống 10
              },
            },
          },
        },
        animation: {
          duration: 1000,
          easing: 'easeOutCubic',
        },
      },
    });
  }

  function renderProjectProgressChart() {
    const ctx = document.getElementById('project-progress-chart');
    const message = document.getElementById('project-chart-message');

    if (!ctx) return;

    // Destroy existing chart
    if (projectProgressChart) {
      projectProgressChart.destroy();
    }

    if (!allProjects || allProjects.length === 0) {
      message.textContent = 'Không có dữ liệu dự án';
      message.classList.remove('hidden');
      return;
    }

    message.classList.add('hidden');

    // Initialize progress ranges
    const progressRanges = {
      '0-25%': { count: 0, projects: [] },
      '26-50%': { count: 0, projects: [] },
      '51-75%': { count: 0, projects: [] },
      '76-99%': { count: 0, projects: [] },
      '100%': { count: 0, projects: [] },
    };

    // Group projects by progress ranges
    allProjects.forEach((project) => {
      const projectTasks = allTasks.filter((task) => task[COL.T_PID] === project[COL.P_ID]);
      const completedTasks = projectTasks.filter((task) =>
        (task[COL.T_STATUS] || '').toLowerCase().includes('hoàn thành')
      ).length;
      const totalTasks = projectTasks.length;
      const progress = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;

      const projectName = project[COL.P_NAME] || 'Chưa có tên';

      // Determine which range the project belongs to
      if (progress === 100) {
        progressRanges['100%'].count++;
        progressRanges['100%'].projects.push(projectName);
      } else if (progress >= 76) {
        progressRanges['76-99%'].count++;
        progressRanges['76-99%'].projects.push(projectName);
      } else if (progress >= 51) {
        progressRanges['51-75%'].count++;
        progressRanges['51-75%'].projects.push(projectName);
      } else if (progress >= 26) {
        progressRanges['26-50%'].count++;
        progressRanges['26-50%'].projects.push(projectName);
      } else {
        progressRanges['0-25%'].count++;
        progressRanges['0-25%'].projects.push(projectName);
      }
    });

    // Prepare chart data
    const labels = Object.keys(progressRanges);
    const data = Object.values(progressRanges).map((range) => range.count);
    const colors = [
      'rgba(239, 68, 68, 0.8)', // Red for 0-25%
      'rgba(245, 158, 11, 0.8)', // Orange for 26-50%
      'rgba(59, 130, 246, 0.8)', // Blue for 51-75%
      'rgba(16, 185, 129, 0.8)', // Green for 76-99%
      'rgba(34, 197, 94, 0.8)', // Dark green for 100%
    ];

    projectProgressChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,

  // === New Staff Performance Chart ===
  function renderStaffPerformanceChart() {
    const ctx = document.getElementById('staff-performance-chart');
    const message = document.getElementById('staff-chart-message');

    if (!ctx) return;

    // Destroy existing chart
    if (staffPerformanceChart) {
      staffPerformanceChart.destroy();
    }

    if (!allStaff || allStaff.length === 0 || !allTasks || allTasks.length === 0) {
      message.textContent = 'Không có dữ liệu nhân viên hoặc nhiệm vụ';
      message.classList.remove('hidden');
      return;
    }

    message.classList.add('hidden');

    // Calculate staff performance
    const staffPerformance = allStaff
      .map((staff) => {
        const staffName = staff[COL.S_NAME] || 'Không tên';
        const assignedTasks = allTasks.filter((task) => task[COL.T_ASSIGNEE] === staffName);
        const completedTasks = assignedTasks.filter((task) =>
          (task[COL.T_STATUS] || '').toLowerCase().includes('hoàn thành')
        );
        const completionRate =
          assignedTasks.length > 0
            ? Math.round((completedTasks.length / assignedTasks.length) * 100)
            : 0;

        return {
          name: staffName,
          totalTasks: assignedTasks.length,
          completedTasks: completedTasks.length,
          completionRate: completionRate,
        };
      })
      .filter((staff) => staff.totalTasks > 0); // Only show staff with assigned tasks

    if (staffPerformance.length === 0) {
      message.textContent = 'Chưa có nhiệm vụ nào được giao';
      message.classList.remove('hidden');
      return;
    }

    staffPerformanceChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: staffPerformance.map((s) => s.name),
        datasets: [
          {
            label: 'Tổng số nhiệm vụ',
            data: staffPerformance.map((s) => s.totalTasks),
            backgroundColor: 'rgba(16, 185, 129, 0.6)',
            borderColor: 'rgba(16, 185, 129, 1)',
            borderWidth: 2,
            borderRadius: 6,
            yAxisID: 'y',
          },
          {
            label: 'Tỷ lệ hoàn thành (%)',
            data: staffPerformance.map((s) => s.completionRate),
            type: 'line',
            backgroundColor: 'rgba(99, 102, 241, 0.2)',
            borderColor: 'rgba(99, 102, 241, 1)',
            borderWidth: 3,
            pointBackgroundColor: 'rgba(99, 102, 241, 1)',
            pointBorderColor: '#fff',
            pointBorderWidth: 2,
            pointRadius: 5,
            pointHoverRadius: 7,
            yAxisID: 'y1',
            tension: 0.4,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: 'index',
          intersect: false,
        },
        plugins: {
          legend: {
            position: 'top',
            labels: {
              usePointStyle: true,
              font: {
                size: 11,
              },
            },
          },
          tooltip: {
            callbacks: {
              label: function (context) {
                const staffData = staffPerformance[context.dataIndex];
                if (context.dataset.label === 'Tổng số nhiệm vụ') {
                  return `${context.dataset.label}: ${context.parsed.y}`;
                } else {
                  return `${context.dataset.label}: ${context.parsed.y}%`;
                }
              },
              afterLabel: function (context) {
                if (context.datasetIndex === 0) {
                  // Only show for total tasks
                  const staffData = staffPerformance[context.dataIndex];
                  return `Hoàn thành: ${staffData.completedTasks}/${staffData.totalTasks}`;
                }
                return '';
              },
            },
          },
        },
        scales: {
          x: {
            ticks: {
              maxRotation: 45,
              minRotation: 0,
              font: {
                size: 10,
              },
            },
          },
          y: {
            type: 'linear',
            display: true,
            position: 'left',
            title: {
              display: true,
              text: 'Số lượng nhiệm vụ',
            },
            beginAtZero: true,
          },
          y1: {
            type: 'linear',
            display: true,
            position: 'right',
            title: {
              display: true,
              text: 'Tỷ lệ (%)',
            },
            beginAtZero: true,
            max: 100,
            grid: {
              drawOnChartArea: false,
            },
            ticks: {
              callback: function (value) {
                return value + '%';
              },
            },
          },
        },
        animation: {
          duration: 1000,
          easing: 'easeOutCubic',
        },
      },
    });
  }

  function openTaskModalForProject(projectId, projectName) {
    openModal('task');
    // Pre-select project after modal opens
    setTimeout(() => {
      const projectSelect = document.querySelector('select[name="projectId"]');
      if (projectSelect) {
        projectSelect.value = projectId;
        projectSelect.dispatchEvent(new Event('change'));
      }
    }, 100);

  // === Enhanced Modal Management ===
  function openModal(type, data = null) {
    const isEdit = data !== null;
    const modalId = `${type}-modal`;

    // Remove existing modal
    const existingModal = document.getElementById(modalId);
    if (existingModal) {
      existingModal.remove();
    }

    let modalHTML = '';

    if (type === 'project') {
      modalHTML = createProjectModal(isEdit, data);
    } else if (type === 'task') {
      modalHTML = createTaskModal(isEdit, data);
    } else if (type === 'staff') {
      modalHTML = createStaffModal(isEdit, data);
    }
    // ✅ THÊM VÀO ĐÂY:
    else if (type === 'notification') {
      modalHTML = createNotificationModal(isEdit, data);
    }

    document.getElementById('modals-container').innerHTML = modalHTML;

    const modal = document.getElementById(modalId);
    modal.classList.add('active');

    // Load subtasks + comments when editing a task
    if (type === 'task' && isEdit && data) {
      setTimeout(() => loadSubtasksAndComments(data[COL.T_ID]), 250);
    }

    // Setup form submission
    const form = modal.querySelector('form');
    if (form) {
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (isEdit) {
          handleEdit(type, data);
        } else {
          handleAdd(type);
        }
      });
    }

    // Setup close handlers - Fixed
    const closeButtons = modal.querySelectorAll('.close-modal');
    closeButtons.forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        closeModal(modalId);
      });
    });
  }

  function openEditModal(type, id) {
    let data = null;

    if (type === 'project') {
      data = allProjects.find((p) => p[COL.P_ID] === id);
    } else if (type === 'task') {
      data = allTasks.find((t) => t[COL.T_ID] === id);
    } else if (type === 'staff') {
      data = allStaff.find((s) => s[COL.S_ID] === id);
    }

    if (data) {
      openModal(type, data);
    } else {
      showToast(`Không tìm thấy ${type} với ID: ${id}`, 'error');
    }
  }

  function closeModal(modalId) {
    const modal = document.getElementById(modalId);
    if (modal) {
      modal.classList.remove('active');
      setTimeout(() => {
        if (modal.parentNode) {
          modal.remove();
        }

        // If task modal closed from project details, reopen project details immediately
        if (modalId === 'task-modal' && openedFromProjectDetails) {
          const { projectId, projectName } = openedFromProjectDetails;
          openedFromProjectDetails = null;
          showProjectDetailsModal(projectId, projectName);
        }
      }, 300);
    }
  }

  // ============================================================
  // == SUBTASK + COMMENT — Frontend Helpers
  // ============================================================

  function loadSubtasksAndComments(taskId) {
    google.script.run
      .withSuccessHandler(function(res) {
        if (!res || !res.success) return;
        var list = document.getElementById('subtask-list');
        if (!list) return;
        var items = res.subtasks || [];
        document.getElementById('subtask-count').textContent = items.length;
        if (items.length === 0) {
          list.innerHTML = '<div class="text-center text-gray-400 text-sm py-2">Chưa có subtask nào</div>';
          return;
        }
        list.innerHTML = items.map(function(st) { return _renderSubtaskRow(st); }).join('');
      })
      .getSubtasks(taskId);

    google.script.run
      .withSuccessHandler(function(res) {
        if (!res || !res.success) return;
        var list = document.getElementById('comment-list');
        if (!list) return;
        var items = res.comments || [];
        document.getElementById('comment-count').textContent = items.length;
        if (items.length === 0) {
          list.innerHTML = '<div class="text-center text-gray-400 text-sm py-2">Chưa có bình luận nào</div>';
          return;
        }
        list.innerHTML = items.map(function(c) { return _renderCommentRow(c); }).join('');
        list.scrollTop = list.scrollHeight;
      })
      .getComments('task', taskId);
  }

  function _renderSubtaskRow(st) {
    var done = (st['Trạng thái'] || '').toLowerCase().includes('hoàn thành');
    return `<div class="flex items-center gap-2 px-3 py-2 rounded-lg" style="background:${done?'#f0fdf4':'#f9fafb'};border:1px solid ${done?'#bbf7d0':'#e5e7eb'}">
      <input type="checkbox" ${done?'checked':''} onchange="toggleSubtask('${st['Mã subtask']}', this.checked)" style="cursor:pointer">
      <span style="flex:1;font-size:13px;${done?'text-decoration:line-through;color:#9ca3af':''}">${st['Tên subtask']}</span>
      <span style="font-size:11px;color:#6b7280">${st['Người thực hiện']||''}</span>
      <button onclick="deleteSubtaskItem('${st['Mã subtask']}')" style="background:none;border:none;cursor:pointer;color:#ef4444;font-size:12px;padding:0 2px" title="Xóa">
        <i class="fas fa-trash"></i>
      </button>
    </div>`;
  }

  function _renderCommentRow(c) {
    var isMine = c['Người bình luận'] === (currentUser && currentUser.name);

        ${(c['Người bình luận']||'?')[0]}
      </div>
      <div style="flex:1;background:#f9fafb;border-radius:8px;padding:8px 12px;border:1px solid #e5e7eb">
        <div class="flex items-center justify-between mb-1">
          <span style="font-size:12px;font-weight:600;color:#374151">${c['Người bình luận']||''}</span>
          <div style="display:flex;align-items:center;gap:6px">
            <span style="font-size:11px;color:#9ca3af">${time}</span>
            ${isMine ? `<button onclick="deleteCommentItem('${c['Mã comment']}')" style="background:none;border:none;cursor:pointer;color:#ef4444;font-size:11px;padding:0" title="Xóa"><i class="fas fa-trash"></i></button>` : ''}
          </div>

  function openAddSubtaskForm(taskId) {
    var form = document.getElementById('subtask-add-form');
    if (form) form.style.display = form.style.display === 'none' ? 'block' : 'none';
  }

  function submitAddSubtask(taskId) {
    var nameEl = document.getElementById('new-subtask-name');
    var assigneeEl = document.getElementById('new-subtask-assignee');
    if (!nameEl || !nameEl.value.trim()) { showToast('Vui lòng nhập tên subtask', 'error'); return; }
    var data = { taskId: taskId, name: nameEl.value.trim(), assignee: assigneeEl ? assigneeEl.value : '' };
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          nameEl.value = '';
          document.getElementById('subtask-add-form').style.display = 'none';
          loadSubtasksAndComments(taskId);
          showToast('Đã thêm subtask', 'success');
        } else {
          showToast((res && res.error) || 'Lỗi', 'error');
        }
      })
      .addSubtask(data);
  }

  function toggleSubtask(subtaskId, checked) {
    var status = checked ? 'Hoàn thành' : 'Đang thực hiện';
    google.script.run
      .withSuccessHandler(function(res) {
        if (!res || !res.success) showToast('Lỗi cập nhật subtask', 'error');
      })
      .updateSubtask(subtaskId, { status: status });
  }

  function deleteSubtaskItem(subtaskId) {
    if (!confirm('Xóa subtask này?')) return;
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          var el = document.querySelector(`[onclick="deleteSubtaskItem('${subtaskId}')"]`);
          if (el) el.closest('[style]').remove();
          showToast('Đã xóa subtask', 'success');
        }
      })
      .deleteSubtask(subtaskId);
  }

  function submitAddComment(taskId) {
    var textEl = document.getElementById('new-comment-text');
    if (!textEl || !textEl.value.trim()) { showToast('Vui lòng nhập nội dung', 'error'); return; }
    var data = { type: 'task', objectId: taskId, content: textEl.value.trim() };
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          textEl.value = '';
          loadSubtasksAndComments(taskId);
        } else {
          showToast((res && res.error) || 'Lỗi gửi bình luận', 'error');
        }
      })
      .addComment(data);
  }

  function deleteCommentItem(commentId) {
    if (!confirm('Xóa bình luận này?')) return;
    // Reload the current task id from the modal
    var taskIdInput = document.querySelector('#task-modal input[name="id"]');
    var taskId = taskIdInput ? taskIdInput.value : null;
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          if (taskId) loadSubtasksAndComments(taskId);
          showToast('Đã xóa bình luận', 'success');
        } else {
          showToast((res && res.error) || 'Lỗi', 'error');
        }
      })
      .deleteComment(commentId);
  }

  function createProjectModal(isEdit, data) {
    const title = isEdit ? 'Chỉnh sửa dự án' : 'Tạo dự án mới';
    const submitText = isEdit ? 'Cập nhật' : 'Tạo dự án';

    // Lọc danh sách người có thể được chọn làm quản lý dự án
    let eligibleManagers = [];

    // THAY ĐỔI: Đảm bảo người quản lý hiện tại của dự án luôn được hiển thị trong danh sách
    if (isEdit && data && data[COL.P_MANAGER]) {
      // Kiểm tra xem người quản lý hiện tại có trong danh sách nhân viên không
      const currentManager = allStaff.find((staff) => staff[COL.S_NAME] === data[COL.P_MANAGER]);

      // Nếu không tìm thấy, thêm một đối tượng giả vào danh sách nhân viên tạm thời
      if (!currentManager) {
        const tempStaff = [...allStaff];
        tempStaff.push({
          [COL.S_NAME]: data[COL.P_MANAGER],
          [COL.S_EMAIL]: '',
        });

        if (isAdmin()) {
          eligibleManagers = tempStaff;
        } else if (isManager()) {
          // Quản lý chỉ có thể chọn chính họ và người quản lý hiện tại
          eligibleManagers = tempStaff.filter(
            (staff) =>
              staff[COL.S_NAME] === currentUser.name || staff[COL.S_NAME] === data[COL.P_MANAGER]
          );
        } else {
          // Người dùng thường chỉ có thể chọn chính họ hoặc người quản lý hiện tại nếu họ là người quản lý
          if (data[COL.P_MANAGER] === currentUser.name) {
            eligibleManagers = tempStaff.filter(
              (staff) =>
                staff[COL.S_NAME] === currentUser.name || staff[COL.S_NAME] === data[COL.P_MANAGER]
            );
          }
        }
      } else {
        // Xử lý bình thường nếu người quản lý đã có trong danh sách
        if (isAdmin()) {
          eligibleManagers = allStaff;
        } else if (isManager()) {
          // Quản lý chỉ có thể chọn chính họ và người quản lý hiện tại
          eligibleManagers = allStaff.filter(
            (staff) =>
              staff[COL.S_NAME] === currentUser.name || staff[COL.S_NAME] === data[COL.P_MANAGER]
          );
        } else {
          // Người dùng thường chỉ có thể chọn chính họ nếu họ là người quản lý dự án
          if (data[COL.P_MANAGER] === currentUser.name) {
            eligibleManagers = allStaff.filter((staff) => staff[COL.S_NAME] === currentUser.name);
          }
        }
      }
    } else {
      // Nếu là tạo mới hoặc không có người quản lý
      if (isAdmin()) {
        eligibleManagers = allStaff;
      } else if (isManager()) {
        eligibleManagers = allStaff.filter((staff) => staff[COL.S_NAME] === currentUser.name);
      }
    }

    setTimeout(() => {
      const startDateInput = document.querySelector('#project-modal input[name="startDate"]');
      const endDateInput = document.querySelector('#project-modal input[name="endDate"]');

      if (startDateInput && endDateInput) {
        startDateInput.addEventListener('change', function () {
          if (endDateInput.value && this.value > endDateInput.value) {
            endDateInput.value = this.value;
          }
          endDateInput.setAttribute('min', this.value);
        });

        endDateInput.addEventListener('change', function () {
          if (startDateInput.value && this.value < startDateInput.value) {
            startDateInput.value = this.value;
          }
          startDateInput.setAttribute('max', this.value);
        });
      }

      // Sync participant checkboxes → hidden input
      function _syncParticipants() {
        var checked = Array.from(document.querySelectorAll('#project-modal .project-participant-cb:checked'))
          .map(function(cb) { return cb.value; });
        var hidden = document.getElementById('project-participants-hidden');
        if (hidden) hidden.value = checked.join(',');
      }
      document.querySelectorAll('#project-modal .project-participant-cb').forEach(function(cb) {
        cb.addEventListener('change', _syncParticipants);
      });
    }, 100);

    return `
      <div id="project-modal" class="modal">
          <div class="modal-content">
              <div class="flex items-center justify-between mb-6">
                  <h3 class="text-xl font-bold text-gray-900">${title}</h3>
                  <button type="button" class="close-modal text-gray-400 hover:text-gray-600">
                      <i class="fas fa-times"></i>
                  </button>
              </div>
              
              <form id="project-form">
                  ${isEdit ? `<input type="hidden" name="id" value="${data[COL.P_ID]}">` : ''}
                  
                  <div class="form-group">
                      <label class="form-label required">Tên dự án</label>
                      <input type="text" name="name" class="form-input" required value="${isEdit ? data[COL.P_NAME] || '' : ''}" ${isEdit && !isAdmin() && !isManager() && !isTeamLeader() ? 'disabled' : ''}>

                  </div>
                  
                  <div class="form-group">
                      <label class="form-label">Mô tả</label>
                      <textarea name="description" class="form-textarea" ${isEdit && !isAdmin() && !isManager() && !isTeamLeader() ? 'disabled' : ''}>${isEdit ? data[COL.P_DESC] || '' : ''}</textarea>
                  </div>
                  
                  <div class="form-group">
                      <label class="form-label">Quản lý dự án</label>
                      <select name="manager" class="form-select" ${isEdit && !isAdmin() && !isManager() && !isTeamLeader() ? 'disabled' : ''} ${(isManager() || isTeamLeader()) && !isAdmin() ? 'disabled' : ''}>
                          <option value="">-- Chọn quản lý --</option>
                          ${eligibleManagers
                            .map((staff) => {
                              let selected = '';
                              if (isEdit) {
                                selected =
                                  data[COL.P_MANAGER] === staff[COL.S_NAME] ? 'selected' : '';
                              } else if (isManager() && !isAdmin()) {
                                // Auto-select manager khi tạo mới
                                selected = staff[COL.S_NAME] === currentUser.name ? 'selected' : '';
                              }
                              const staffEmail = staff[COL.S_EMAIL]
                                ? ` (${staff[COL.S_EMAIL]})`
                                : '';
                              return `<option value="${staff[COL.S_NAME]}" ${selected}>${staff[COL.S_NAME]}${staffEmail}</option>`;
                            })
                            .join('')}
                      </select>
                  </div>
                  
                  <div class="grid grid-cols-3 gap-4">
                      <div class="form-group">
                          <label class="form-label required">Ngày bắt đầu</label>
                          <input type="date" name="startDate" class="form-input" required value="${isEdit ? formatDateForInput(data[COL.P_START]) : ''}" ${isEdit && !isAdmin() && !isManager() && !isTeamLeader() ? 'disabled' : ''}>
                      </div>
                      <div class="form-group">
                          <label class="form-label required">Ngày kết thúc</label>
                          <input type="date" name="endDate" class="form-input" required value="${isEdit ? formatDateForInput(data[COL.P_END]) : ''}" ${isEdit && !isAdmin() && !isManager() && !isTeamLeader() ? 'disabled' : ''}>
